name: PR preview

# Builds each pull request to gh-pages under pr-preview/pr-<number>/ and comments
# the link on the PR. The preview is removed when the PR is closed or merged.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run build -- --mode pr-preview
      - if: github.event.action != 'closed'
        run: npm test
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
